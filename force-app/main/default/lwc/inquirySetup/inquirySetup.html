<template>
    <lightning-card title="Medical Inquiries" icon-name="standard:case">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-text-body_regular slds-m-bottom_small">
                Creates demo <strong>Case</strong> + <strong>Inquiry</strong> + <strong>InquiryQuestion</strong>
                records for each demo HCP in the selected territory. Cases use the <em>Medical Inquiry</em> record type;
                questions are realistic clinical asks for Immunexis (RA / autoimmune) and Immunonco (oncology).
            </p>

            <!-- Objects created by this tab -->
            <div class="slds-box slds-theme_shade slds-m-bottom_medium slds-p-around_small">
                <p class="slds-text-title_caps slds-m-bottom_x-small">Objects created by this tab</p>
                <ul class="slds-list_dotted slds-text-body_small">
                    <li><strong>Case</strong> &mdash; 1-2 per HCP, RecordType "Medical Inquiry", Status Submitted, Origin Phone</li>
                    <li><strong>Inquiry</strong> &mdash; one per Case, Type Medical Inquiry, with disclaimer text + submitted timestamp</li>
                    <li><strong>InquiryQuestion</strong> &mdash; 1-2 per Inquiry, ResponseStatus NotResponded</li>
                </ul>
            </div>

            <!-- Status Section -->
            <div class="slds-m-bottom_medium">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                    <h3 class="slds-text-heading_small">Current Status</h3>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh status"
                        title="Refresh status"
                        onclick={handleRefreshStatus}
                        class="slds-m-left_x-small"
                        size="small">
                    </lightning-button-icon>
                </div>
                <template if:true={statusError}>
                    <div class="slds-box slds-theme_shade slds-p-around_small">
                        <p class="slds-text-color_error">{statusError}</p>
                    </div>
                </template>
                <template if:true={statusData}>
                    <div class="slds-box slds-theme_shade slds-p-around_small">
                        <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                        <span>{statusData}</span>
                    </div>
                </template>
                <template if:false={statusData}>
                    <template if:false={statusError}>
                        <div class="slds-box slds-theme_shade slds-p-around_small">
                            <span class="slds-text-color_weak">Loading status...</span>
                        </div>
                    </template>
                </template>
            </div>

            <!-- Territory Picker -->
            <div class="slds-m-bottom_small">
                <lightning-combobox
                    name="territory"
                    label="Select Territory"
                    placeholder="Choose a territory..."
                    options={territoryOptions}
                    value={selectedTerritoryId}
                    onchange={handleTerritoryChange}>
                </lightning-combobox>
            </div>

            <!-- Record Type Picker -->
            <div class="slds-m-bottom_medium">
                <lightning-radio-group
                    name="recordType"
                    label="Inquiry Record Type"
                    options={recordTypeOptions}
                    value={selectedRecordType}
                    onchange={handleRecordTypeChange}
                    type="radio">
                </lightning-radio-group>
            </div>

            <!-- Response Delivery Preference -->
            <div class="slds-m-bottom_medium">
                <lightning-radio-group
                    name="responsePreference"
                    label="Response Delivery Preference"
                    options={responsePreferenceOptions}
                    value={selectedResponsePreference}
                    onchange={handleResponsePreferenceChange}
                    type="radio">
                </lightning-radio-group>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    Picks one ContactPoint of the chosen type per HCP and sets it on the Inquiry's
                    <em>Response Contact Point</em> field. Primary contact point preferred when available.
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="slds-m-bottom_medium">
                <lightning-button
                    variant="brand"
                    label="Create Inquiries for Territory"
                    icon-name="utility:add"
                    onclick={handleCreate}
                    disabled={isLoading}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    variant="destructive"
                    label="Delete Territory Inquiries"
                    icon-name="utility:delete"
                    onclick={handleDeleteTerritory}
                    disabled={isLoading}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    variant="destructive"
                    label="Delete All Inquiries"
                    icon-name="utility:delete"
                    onclick={handleDelete}
                    disabled={isLoading}>
                </lightning-button>
            </div>

            <!-- Spinner -->
            <template if:true={isLoading}>
                <div class="slds-is-relative slds-m-bottom_medium" style="height: 60px;">
                    <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Activity Log -->
            <template if:true={hasActivityLog}>
                <div class="slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">Activity Log</h3>
                    <div class="slds-box slds-theme_shade slds-p-around_small" style="max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6;">
                        <template for:each={activityLog} for:item="entry">
                            <p key={entry.id} class="slds-m-bottom_xxx-small">
                                <template if:true={entry.isHeader}>
                                    <strong style="color: #0070d2;">{entry.message}</strong>
                                </template>
                                <template if:true={entry.isSuccess}>
                                    <span style="color: #2e844a;">&#10003; {entry.message}</span>
                                </template>
                                <template if:true={entry.isError}>
                                    <span style="color: #c23934;">&#10007; {entry.message}</span>
                                </template>
                                <template if:true={entry.isWarning}>
                                    <span style="color: #fe9339;">&#9888; {entry.message}</span>
                                </template>
                                <template if:true={entry.isDetail}>
                                    <span style="color: #444;">&#8226; {entry.message}</span>
                                </template>
                            </p>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Status Messages -->
            <template if:true={resultMessage}>
                <div class={resultClass}>
                    <p>{resultMessage}</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
